version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - prealloc
    - noctx
    - bodyclose
    - contextcheck
    - durationcheck
    - exhaustive
    - exportloopref
    - forcetypeassert
    - nilerr
    - nilnil
    - predeclared
    - tparallel
    - wastedassign
    - whitespace

linters-settings:
  goimports:
    local-prefixes: github.com/natalie-o-perret/go-irc
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    # Allow unhandled errors in defer Close()
    - linters: [errcheck]
      text: "(Close|Flush|Write|WriteString)"
    # Test files can use t.Fatal etc. freely
    - path: "_test\\.go"
      linters: [forcetypeassert, unparam]
  max-issues-per-linter: 0
  max-same-issues: 0

