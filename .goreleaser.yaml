version: 2

project_name: go-irc

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ircd
    main: ./cmd/ircd
    binary: ircd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: ircb
    main: ./cmd/ircb
    binary: ircb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: ircx
    main: ./cmd/ircx
    binary: ircx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    # Only sign if GPG key is available
    if: '{{ ne .Env.GPG_FINGERPRINT "" }}'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - typo
  groups:
    - title: "✨ New Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "⚡ Performance"
      regexp: "^perf"
      order: 2
    - title: "🔒 Security"
      regexp: "^sec"
      order: 3
    - title: "Other"
      order: 999

release:
  github:
    owner: natalie-o-perret
    name: go-irc
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Tag}}"

dockers:
  - id: ircd
    image_templates:
      - "ghcr.io/natalie-o-perret/go-irc/ircd:{{ .Tag }}"
      - "ghcr.io/natalie-o-perret/go-irc/ircd:latest"
    dockerfile: Dockerfile.ircd
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title=ircd"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    use: buildx
    goarch: amd64

  - id: ircb
    image_templates:
      - "ghcr.io/natalie-o-perret/go-irc/ircb:{{ .Tag }}"
      - "ghcr.io/natalie-o-perret/go-irc/ircb:latest"
    dockerfile: Dockerfile.ircb
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title=ircb"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    use: buildx
    goarch: amd64

